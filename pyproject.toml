[project]
name = "tillflow-retail-etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-storage-blob>=12.31.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pandera>=0.35.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
tillflow-retail-etl = "tillflow_retail_etl:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
